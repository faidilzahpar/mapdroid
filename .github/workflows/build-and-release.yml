name: Build and Release MapDroid (Android & iOS)

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Android APK Assets
        run: |
          mkdir -p android_dist
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          TAG_NAME="v1.0.${{ github.run_number }}"
          cp "$APK_FILE" "android_dist/mapdroid-${TAG_NAME}.apk"
          cp "$APK_FILE" "android_dist/mapdroid-latest.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android_dist/*

  build-ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift Packages
        run: |
          xcodebuild -resolvePackageDependencies -project ios/MapDroid.xcodeproj

      - name: Build Unsigned iOS App (.app)
        run: |
          xcodebuild -project ios/MapDroid.xcodeproj \
            -scheme MapDroid \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned .app into .ipa
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "MapDroid.app" -type d | grep "Release-iphoneos" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find built MapDroid.app!"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          TAG_NAME="v1.0.${{ github.run_number }}"
          mkdir -p ios_dist
          zip -r "ios_dist/mapdroid-${TAG_NAME}.ipa" Payload
          cp "ios_dist/mapdroid-${TAG_NAME}.ipa" "ios_dist/mapdroid-latest.ipa"
          rm -rf Payload

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios_dist/*

  release:
    name: Publish GitHub Release (Android & iOS)
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release_assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: release_assets

      - name: List Release Assets
        run: ls -la release_assets/

      - name: Create GitHub Release & Auto Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "MapDroid v1.0.${{ github.run_number }} (Android & iOS)"
          body: |
            ## MapDroid Release v1.0.${{ github.run_number }} 🗺️📱
            
            Aplikasi Peta Digital Berbasiskan **MapLibre Native SDK** untuk **Android & iOS**.
            
            ### 🤖 Unduh untuk Android (.apk)
            - **[Unduh mapdroid-v1.0.${{ github.run_number }}.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/mapdroid-v1.0.${{ github.run_number }}.apk)**
            - **[Unduh mapdroid-latest.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/mapdroid-latest.apk)**
            
            ### 🍏 Unduh untuk iOS (.ipa)
            - **[Unduh mapdroid-v1.0.${{ github.run_number }}.ipa](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/mapdroid-v1.0.${{ github.run_number }}.ipa)**
            - **[Unduh mapdroid-latest.ipa](https://github.com/${{ github.repository }}/releases/download/v1.0.${{ github.run_number }}/mapdroid-latest.ipa)**
            
            ---
            *Otomatis di-build dan dirilis via GitHub Actions dari commit `${{ github.sha }}`.*
          files: |
            release_assets/mapdroid-*
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
