name: Build and Release MapDroid APK

on:
  push:
    branches:
      - main
    tags-ignore:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare Release Assets
        id: prep
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          # Find the generated release APK
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          
          mkdir -p dist
          # Copy to specific versioned name and generic latest name
          cp "$APK_FILE" "dist/mapdroid-${TAG_NAME}.apk"
          cp "$APK_FILE" "dist/mapdroid-latest.apk"
          ls -la dist/

      - name: Create GitHub Release & Auto Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "MapDroid ${{ steps.prep.outputs.tag_name }}"
          body: |
            ## MapDroid Release ${{ steps.prep.outputs.tag_name }} 🗺️📱
            
            Aplikasi Android Peta Berbasiskan **MapLibre Native Android SDK**.
            
            ### 📥 Unduh File APK
            - **[Unduh mapdroid-${{ steps.prep.outputs.tag_name }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag_name }}/mapdroid-${{ steps.prep.outputs.tag_name }}.apk)**
            - **[Unduh mapdroid-latest.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.prep.outputs.tag_name }}/mapdroid-latest.apk)**
            
            ---
            *Otomatis di-build dan dirilis via GitHub Actions dari commit `${{ github.sha }}`.*
          files: |
            dist/mapdroid-*.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
