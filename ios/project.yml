name: MapDroid
options:
  bundleIdPrefix: com.mapdroid
  deploymentTarget:
    iOS: 15.0
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
targets:
  MapDroid:
    type: application
    platform: iOS
    deploymentTarget: 15.0
    sources:
      - path: MapDroid
    dependencies:
      - package: MapLibre
    info:
      path: MapDroid/Info.plist
      properties:
        CFBundleDisplayName: MapDroid
        NSLocationWhenInUseUsageDescription: MapDroid membutuhkan akses lokasi untuk menampilkan posisi Anda pada peta.
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mapdroid.app
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0
